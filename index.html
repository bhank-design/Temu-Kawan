<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff6b35">
<title>Temu Kawan Pro v7</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p1:#ff6b35;--p2:#f7931e;--p3:#a855f7;--bg:#fff8f0;--card:#fff;--txt:#1e293b;--muted:#94a3b8;--border:#f0e6dc;--ok:#10b981;--err:#ef4444;--verify:#ff8c00;--grad:linear-gradient(135deg,#ff6b35,#f7931e,#a855f7);--shadow:0 4px 20px rgba(255,107,53,.1)}
body.dark{--bg:#0f172a;--card:#1e293b;--txt:#f1f5f9;--muted:#94a3b8;--border:#334155;--shadow:0 4px 20px rgba(0,0,0,.4)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:100px;overflow-x:hidden;transition:background .3s,color .3s}
#app{max-width:560px;margin:0 auto;padding:12px}
input,textarea,button,select{font-family:inherit;outline:none;border:none;background:none;color:inherit}
button{cursor:pointer;transition:transform .12s,opacity .15s}
button:active{transform:scale(.96)}
.header{background:var(--card);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:8px;margin-bottom:14px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:20}
.logo{font-size:20px;font-weight:900;flex:1;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:-2px}
.back-header{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:20}
.back-header .back-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,107,53,.1);color:var(--p1);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.back-header .title{flex:1;font-weight:900;font-size:16px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0;border:2.5px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);background:var(--grad);color:#fff;font-weight:700;position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:34px;height:34px;font-size:17px}
.avatar.xs{width:26px;height:26px;font-size:13px;border-width:2px}
.avatar.lg{width:88px;height:88px;font-size:44px;border-width:4px}
.avatar.online::after{content:'';position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2.5px solid var(--card);z-index:2}
.icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,107,53,.1);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;flex-shrink:0;color:var(--p1)}
.icon-btn.online-btn{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--err);color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--card)}
.badge.green{background:var(--ok)}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.bottomnav .inner{max-width:560px;margin:0 auto;display:flex}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--muted);font-size:10px;font-weight:700;position:relative}
.navbtn .ic{font-size:22px;line-height:1}
.navbtn.active{color:var(--p1)}
.navbtn.create{flex:0 0 60px}
.navbtn.create .ic{width:44px;height:44px;background:var(--grad);color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;margin-top:-12px;box-shadow:0 6px 18px rgba(255,107,53,.4);border:3px solid var(--card)}
.scroll-top{position:fixed;bottom:90px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;font-size:18px;box-shadow:0 6px 20px rgba(255,107,53,.5);display:none;z-index:25;border:2px solid #fff}
.scroll-top.show{display:flex;align-items:center;justify-content:center}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--grad)}
.auth-card{background:var(--card);border-radius:28px;padding:34px 26px;max-width:420px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.25);text-align:center}
.auth-logo{font-size:38px;font-weight:900;margin-bottom:6px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-tag{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.auth-by{font-size:11px;color:var(--muted);margin-bottom:20px;padding:7px;background:linear-gradient(135deg,rgba(255,107,53,.08),rgba(168,85,247,.08));border-radius:10px;font-weight:600}
.field{width:100%;padding:14px 18px;background:rgba(255,107,53,.05);border:2px solid var(--border);border-radius:16px;font-size:15px;margin-bottom:12px;color:var(--txt)}
.field:focus{border-color:var(--p1);background:var(--card)}
.field-wrap{position:relative;margin-bottom:12px}
.field-wrap .field{margin-bottom:0;padding-right:50px}
.field-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
.emoji-pick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:18px}
.emoji-pick button{font-size:20px;background:rgba(255,107,53,.05);border:2px solid transparent;border-radius:11px;padding:6px}
.emoji-pick button.sel{border-color:var(--p1);background:rgba(255,107,53,.15)}
.btn{width:100%;padding:14px;background:var(--grad);color:#fff;border-radius:16px;font-weight:800;font-size:15px;box-shadow:0 8px 20px rgba(255,107,53,.35)}
.btn.sec{background:rgba(255,107,53,.1);color:var(--txt);box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 8px 20px rgba(37,211,102,.35)}
.link{color:var(--p1);font-weight:700;cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ct{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--card);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer}
.ct .fake{flex:1;background:rgba(255,107,53,.07);border-radius:22px;padding:11px 16px;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:80px;padding:10px;border-radius:14px;font-weight:700;font-size:13px;background:rgba(255,107,53,.08);color:var(--muted);white-space:nowrap}
.tab.active{background:var(--grad);color:#fff}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-head .info{flex:1;min-width:0}
.post-head .name{font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.post-head .time{font-size:11px;color:var(--muted)}
.post-text{font-size:14.5px;line-height:1.55;margin-bottom:10px;word-wrap:break-word;white-space:pre-wrap}
.post-img{width:100%;border-radius:14px;margin-bottom:10px;display:block;max-height:480px;object-fit:cover;cursor:pointer}
.post-actions{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--border)}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:12px;font-size:13px;font-weight:700;color:var(--muted)}
.act.liked{color:var(--p1)}
.comments{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.comments.open{display:block}
.cmt{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.cmt .body{background:rgba(255,107,53,.06);border-radius:14px;padding:8px 12px;flex:1}
.cmt .body b{display:block;font-size:12px;color:var(--p1);margin-bottom:2px}
.cmt-input{display:flex;gap:8px;margin-top:8px}
.cmt-input input{flex:1;background:rgba(255,107,53,.07);border-radius:20px;padding:10px 16px;font-size:13px;color:var(--txt)}
.cmt-input button{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;font-size:16px;flex-shrink:0}
.empty{text-align:center;padding:50px 24px;color:var(--muted)}
.empty .big{font-size:56px;margin-bottom:12px;opacity:.5}
.empty h4{font-size:15px;font-weight:800;color:var(--txt);margin-bottom:6px}
.user-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:16px;margin-bottom:8px;box-shadow:0 2px 8px rgba(255,107,53,.05);cursor:pointer}
.user-row .info{flex:1;min-width:0}
.user-row .name{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.user-row .bio{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini-btn{padding:7px 16px;border-radius:16px;font-weight:800;font-size:12px;background:var(--grad);color:#fff;flex-shrink:0}
.mini-btn.following{background:rgba(255,107,53,.1);color:var(--txt)}
.verify-icon{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--verify);color:#fff;font-size:10px;font-weight:900;margin-left:3px;flex-shrink:0}
.verify-icon.founder{background:linear-gradient(135deg,#ff6b35,#f7931e);width:17px;height:17px;font-size:11px;box-shadow:0 0 0 2px rgba(255,107,53,.3)}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-radius:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.chat-header .name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:4px}
.chat-header .sub{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.chat-header .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chat-header .dot.on{background:var(--ok)}
.back-btn{font-size:22px;padding:4px 8px;color:var(--txt);font-weight:300}
.chat-body{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-height:420px;max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:78%;padding:10px 14px;border-radius:20px;font-size:14px;line-height:1.4;word-wrap:break-word;position:relative}
.bubble.me{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bubble.them{background:rgba(255,107,53,.08);color:var(--txt);align-self:flex-start;border-bottom-left-radius:6px}
.bubble .t{font-size:10px;opacity:.65;margin-top:4px;display:block;text-align:right}
.bubble img,.bubble audio{max-width:100%;border-radius:12px;display:block;margin-bottom:4px}
.chat-input-row{display:flex;gap:8px;margin-top:12px;padding:6px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);align-items:center}
.chat-input-row input{flex:1;padding:12px 16px;font-size:14px;background:transparent;color:var(--txt)}
.chat-input-row .sm-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,107,53,.1);font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chat-input-row .send{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;font-size:18px;flex-shrink:0}
/* PROFILE dengan BACKGROUND */
.profile-hero-v2{position:relative;border-radius:24px;overflow:hidden;margin-bottom:14px;color:#fff}
.profile-cover{width:100%;height:200px;background:var(--grad);position:relative;background-size:cover;background-position:center}
.profile-cover-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.6));pointer-events:none}
.profile-header-info{position:relative;padding:0 20px 20px;margin-top:-60px;z-index:2;text-align:center}
.profile-header-info .avatar{width:100px;height:100px;font-size:50px;border:5px solid var(--card);margin:0 auto 12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.profile-header-info .pname{font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.profile-header-info .pbio{font-size:13px;opacity:.95;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);margin-bottom:14px;line-height:1.5}
.profile-header-info .pmeta{display:flex;gap:14px;justify-content:center;font-size:11px;margin-bottom:14px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);flex-wrap:wrap}
.profile-header-info .pmeta span{display:flex;align-items:center;gap:4px}
.profile-bg{background:var(--card);padding:20px;border-top-left-radius:24px;border-top-right-radius:24px;margin-top:-16px;position:relative;z-index:1}
.profile-hero-v2 .stats{display:flex;justify-content:space-around;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:14px}
.profile-hero-v2 .stat{padding:4px 12px;border-radius:12px;cursor:pointer}
.profile-hero-v2 .stat .n{font-size:20px;font-weight:900;color:var(--txt)}
.profile-hero-v2 .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:24px;padding:24px;max-width:440px;width:100%;margin:auto;max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:16px;font-size:18px;text-align:center;font-weight:800}
.modal label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase}
.img-prev{position:relative;margin-bottom:12px;display:none}
.img-prev.show{display:block}
.img-prev img{width:100%;border-radius:14px;max-height:280px;object-fit:cover;transition:filter .2s}
.img-prev button{position:absolute;top:8px;right:8px;width:30px;height:30px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;font-size:14px;z-index:2}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--card);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;padding:8px 4px;display:flex;align-items:center;gap:6px}
.section-title .num{background:var(--p1);color:#fff;font-size:10px;padding:1px 7px;border-radius:8px}
.notif{display:flex;gap:10px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(255,107,53,.05);cursor:pointer;border-left:3px solid transparent}
.notif.unread{border-left-color:var(--p1);background:rgba(255,107,53,.05)}
.notif .body{flex:1;font-size:13px;line-height:1.5}
.notif .body b{color:var(--p1)}
.notif .t{font-size:11px;color:var(--muted);margin-top:3px}
.notif .follow-btn{margin-top:6px;padding:5px 12px;border-radius:12px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;display:inline-block}
.stories{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px;margin-bottom:8px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-item{flex-shrink:0;text-align:center;cursor:pointer;width:68px}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff6b35,#f7931e,#a855f7);display:flex;align-items:center;justify-content:center;position:relative}
.story-ring.seen{background:var(--border)}
.story-ring .avatar{width:100%;height:100%;font-size:26px;border:none;box-shadow:none;background:var(--card);color:var(--txt)}
.story-ring .plus{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;background:var(--grad);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;border:2.5px solid var(--card)}
.story-item .lbl{font-size:11px;color:var(--txt);font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-item{background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(255,107,53,.05);cursor:pointer}
.group-item .gic{width:48px;height:48px;border-radius:16px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.group-item .info{flex:1;min-width:0}
.group-item .name{font-weight:800;font-size:14px}
.group-item .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-stat{background:var(--card);border-radius:16px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(255,107,53,.05)}
.admin-stat .n{font-size:26px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.admin-stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px;font-weight:700}
.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.footer-copy{text-align:center;padding:14px;margin-top:20px;margin-bottom:70px;font-size:11px;color:var(--muted);line-height:1.7}
.footer-copy b{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800}
.verified-badge{background:linear-gradient(135deg,#ff8c00,#ff6b35);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.verified-badge::before{content:'✓';font-size:12px;font-weight:900}
.sk-box{background:rgba(255,107,53,.06);border-radius:12px;padding:12px;font-size:12px;line-height:1.7;color:var(--txt);margin-bottom:12px;max-height:180px;overflow-y:auto}
.sk-box b{color:var(--p1);display:block;margin-bottom:6px}
.setting-list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.setting-item{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border);cursor:pointer}
.setting-item:last-child{border-bottom:none}
.setting-item .sic{font-size:22px;flex-shrink:0;width:28px;text-align:center}
.setting-item .stxt{flex:1}
.setting-item .sttl{font-weight:700;font-size:14px}
.setting-item .ssub{font-size:11px;color:var(--muted);margin-top:2px}
.setting-item .sarr{color:var(--muted);font-size:18px;font-weight:300}
.setting-item.danger .sttl{color:var(--err)}
.setting-section-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;padding:14px 8px 8px;display:flex;align-items:center;gap:6px}
.setting-section-title.founder{color:var(--verify)}
.founder-box{border:2px solid var(--verify);border-radius:20px;overflow:hidden;background:var(--card);margin-bottom:14px}
.founder-head{padding:14px 18px;background:linear-gradient(135deg,rgba(255,107,53,.15),rgba(168,85,247,.15));display:flex;align-items:center;gap:10px}
.founder-head .fic{font-size:24px}
.founder-head .fttl{font-weight:900;font-size:14px;color:var(--verify)}
.founder-head .fsub{font-size:11px;color:var(--muted);margin-top:2px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.pin-pad button{padding:20px;font-size:22px;font-weight:800;background:rgba(255,107,53,.08);border-radius:16px;color:var(--txt)}
.pin-dots{text-align:center;font-size:24px;letter-spacing:8px;color:var(--p1);min-height:30px;margin-bottom:10px}
.stat-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(255,107,53,.05)}
.stat-row .sic{font-size:22px;flex-shrink:0}
.stat-row .stxt{flex:1;font-size:13px;font-weight:600}
.stat-row .sval{font-weight:900;color:var(--p1);font-size:14px}
.filter-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}

function defaultState() {

  try {

  return defaultState();

  if (id) localStorage.setItem(AUTOLOGIN_KEY, id);

}

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function timeAgo(t) {
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 5) return 'baru saja';
  if (s < 60) return s + ' dtk lalu';
  if (s < 3600) return Math.floor(s/60) + ' mnt lalu';
  if (s < 86400) return Math.floor(s/3600) + ' jam lalu';
  if (s < 604800) return Math.floor(s/86400) + ' hr lalu';
  return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'});
}
function timeFull(t){ return new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function isOnline(id){
  const u = state.users[id]; if (!u) return false;
  if (u.isBot) return true;
  return Date.now() - (u.lastSeen || 0) < 45000;
}
function chatKey(a,b){ return [a,b].sort().join('__'); }
function toast(msg){
  const el = $('toast'); if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function playSoundEffect(freq, dur){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq || 700; o.type='sine';
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur||0.2));
    o.start(); o.stop(ctx.currentTime + (dur||0.2));
  } catch(e){}
}
function buildFilter(){
  let f = 'brightness(' + currentFilter.brightness + '%) contrast(' + currentFilter.contrast + '%) saturate(' + currentFilter.saturate + '%) hue-rotate(' + currentFilter.hue + 'deg)';
  if (currentFilter.blur > 0) f += ' blur(' + currentFilter.blur + 'px)';
  if (currentFilter.effect === 'grayscale') f += ' grayscale(100%)';
  if (currentFilter.effect === 'sepia') f += ' sepia(80%)';
  if (currentFilter.effect === 'vintage') f += ' sepia(40%) contrast(110%) brightness(90%)';
  if (currentFilter.effect === 'cool') f += ' hue-rotate(180deg)';
  if (currentFilter.effect === 'warm') f += ' hue-rotate(-30deg) saturate(130%)';
  return f;
}

function renderAuth(){

      };
      $('aBtn').onclick = function(){

          setMeId(FOUNDER.id);
          enterApp(FOUNDER.name);
          return;
        }
        const found = Object.values(state.users).find(function(u){

          const k = key.toLowerCase();

        });
        if (!found) return toast('Akun tidak ditemukan');
        if (found.password !== pass) return toast('Password salah');
        setMeId(found.id); enterApp(found.name);
      };
      $('goReg').onclick = function(){ mode = 'register'; drawForm(); };
      $('goForgot').onclick = function(){ mode = 'forgot'; drawForm(); };

      f.innerHTML = '<p style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6;text-align:left">Masukkan <b>Username</b> + <b>Email</b> terdaftar.</p>' +

        '<div id="fResult" style="margin-top:18px"></div>';
      $('goLog').onclick = function(){ mode = 'login'; drawForm(); };
      $('fBtn').onclick = function(){
        const key = $('fUser').value.trim().toLowerCase();

        if (!key || !email) { res.innerHTML = '<p style="color:var(--err);font-size:13px">⚠️ Isi username & email!</p>'; return; }
        const found = Object.values(state.users).find(function(u){
          if (u.isBot || u.id === FOUNDER.id) return false;
          return ((u.id.toLowerCase() === key) || (u.username && u.username.toLowerCase() === key) || (u.name.toLowerCase() === key) || (u.email && u.email.toLowerCase() === key)) && u.email && u.email.toLowerCase() === email;

          '<p style="font-size:12px;color:var(--ok);font-weight:800;margin-bottom:10px">✅ Akun: <b>' + esc(found.name) + '</b></p>' +
          '<div class="field-wrap"><input class="field" id="fNew1" type="password" placeholder="Password baru"><button class="field-eye" onclick="toggleEye(\'fNew1\',this)" type="button">👁️</button></div>' +

          '<button class="btn" id="fReset" style="background:linear-gradient(135deg,#10b981,#059669)">✅ Reset Password</button></div>';
        $('fReset').onclick = function(){

          if (!p1 || p1.length < 4) return toast('Password min 4 karakter');
          if (p1 !== p2) return toast('Password tidak sama!');
          found.password = p1;
          saveState(); toast('🎉 Password direset!');
          setTimeout(function(){ mode = 'login'; drawForm(); }, 1200);
        };
      };
    } else {
      f.innerHTML = '<input class="field" id="aUser" placeholder="Username (min 3)" maxlength="20">' +
        '<input class="field" id="aName" placeholder="Nama tampilan" maxlength="24">' +
        '<input class="field" id="aEmail" type="email" placeholder="Email" maxlength="60">' +
        '<div class="field-wrap"><input class="field" id="aPass" type="password" placeholder="Password (min 4)"><button class="field-eye" onclick="toggleEye(\'aPass\',this)" type="button">👁️</button></div>' +
        '<input class="field" id="aBio" placeholder="Bio (opsional)" maxlength="80">' +
        '<label style="font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;display:block;text-align:left;margin-bottom:8px">Pilih avatar</label>' +
        '<div class="emoji-pick" id="aEmoji">' + AVATARS.map(function(e,i){return '<button type="button" data-e="'+e+'" class="'+(i===0?'sel':'')+'">'+e+'</button>';}).join('') + '</div>' +
        '<button class="btn" id="aBtn">Daftar Sekarang ✨</button>' +
        '<p style="margin-top:16px;font-size:13px;color:var(--muted);text-align:center">Sudah punya akun? <span class="link" id="goLog">Masuk</span></p>';
      $('aEmoji').onclick = function(e){
        const b = e.target.closest('button'); if (!b) return;
        this.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
        b.classList.add('sel'); picked = b.dataset.e;
      };
      $('aBtn').onclick = function(){
        const username = $('aUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
        const name = $('aName').value.trim();
        const email = $('aEmail').value.trim().toLowerCase();
        const pass = $('aPass').value;
        const bio = $('aBio').value.trim();
        if (!username || username.length < 3) return toast('Username min 3 karakter');
        if (username === FOUNDER.username) return toast('Username tidak bisa dipakai');
        if (!name) return toast('Isi nama');
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Email tidak valid');
        if (!pass || pass.length < 4) return toast('Password min 4 karakter');
        if (state.users['u_' + username]) return toast('Username sudah dipakai');
        if (Object.values(state.users).some(function(u){return u.email && u.email.toLowerCase() === email;})) return toast('Email sudah terdaftar');
        const id = 'u_' + username;
        state.users[id] = {
          id: id, username: username, name: name, email: email, avatar: picked, avatarPic: null, coverPic: null,
          bio: bio || 'Hai! Saya pengguna baru 👋',
          password: pass, isBot: false, isAdmin: false, isFounder: false, verified: false,
          following: ['bot0','bot1'], followers: [], joinedAt: Date.now(), lastSeen: Date.now(), wa: '', kota: ''
        };
        state.users['bot0'].followers.push(id);
        state.users['bot1'].followers.push(id);
        Object.values(state.users).forEach(function(other){
          if (!other.isBot && other.id !== id && !other.isFounder) {
            pushNotif(other.id, 'newuser', { by: id });
          }
        });
        saveState();
        setMeId(id); enterApp(name);
      };
      $('goLog').onclick = function(){ mode = 'login'; drawForm(); };
    }
  }
}

window.toggleEye = function(inputId, btn){
  const p = $(inputId); if (!p) return;
  if (p.type === 'password') { p.type = 'text'; btn.textContent = '🙈'; }
  else { p.type = 'password'; btn.textContent = '👁️'; }
};

/* ============ MODAL ONLINE ============ */
function openOnlineModal(){
  const m = document.createElement('div');
  m.className = 'modal-bg open';
  m.id = 'onlineModal';
  m.innerHTML = '<div class="modal" style="max-height:85vh"><h3>🟢 User Online</h3>' +
    '<input class="field" id="onlineSearch" placeholder="🔍 Cari nama..." style="margin-bottom:12px">' +
    '<div class="tabs" id="onlineFilter" style="margin-bottom:12px">' +
      '<button class="tab active" data-filter="online">🟢 Online</button>' +
      '<button class="tab" data-filter="all">👥 Semua</button>' +
    '</div>' +
    '<div id="onlineList" style="max-height:55vh;overflow-y:auto"></div>' +
    '<button class="btn sec" id="closeOnline" style="margin-top:12px">Tutup</button></div>';
  document.body.appendChild(m);

  let filterMode = 'online';
  let searchQuery = '';

  function drawList(){
    const list = $('onlineList'); if (!list) return;
    const meId = getMeId();
    let users = Object.values(state.users).filter(function(u){ return u.id !== meId; });

    if (filterMode === 'online') users = users.filter(function(u){ return isOnline(u.id); });
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      users = users.filter(function(u){ return u.name.toLowerCase().indexOf(q) >= 0; });
    }
    users.sort(function(a,b){ return (b.lastSeen||0) - (a.lastSeen||0); });

    if (!users.length) {
      list.innerHTML = '<div class="empty" style="padding:30px"><div class="big">🌙</div><h4>' + (filterMode === 'online' ? 'Tidak ada yang online' : 'Belum ada user lain') + '</h4><p style="font-size:12px">Coba lagi nanti ya</p></div>';
      return;
    }

    list.innerHTML = users.slice(0, 50).map(function(u){
      const online = isOnline(u.id);
      const hasWA = u.wa && u.wa.length >= 10;
      return '<div class="online-item">' +
        avatarHtml(u, online ? 'online' : '') +
        '<div class="info"><div class="name">' + nameWithBadge(u) + (u.isBot?'<span style="background:rgba(16,185,129,.15);color:var(--ok);font-size:9px;padding:1px 6px;border-radius:6px;font-weight:800">BOT</span>':'') + '</div>' +
        '<div class="bio' + (online?'':' off') + '">' + (online ? '🟢 Online • ' + timeAgo(u.lastSeen||Date.now()) : '⚫ Terakhir ' + timeAgo(u.lastSeen||u.joinedAt)) + '</div></div>' +
        '<div class="online-actions">' +
          '<button class="oa-chat" data-act="chat" data-uid="' + u.id + '" title="Chat">💬</button>' +
          '<button class="oa-wa" data-act="wa" data-uid="' + u.id + '" title="WhatsApp"' + (hasWA?'':' disabled') + '>📞</button>' +
          '<button class="oa-profile" data-act="profile" data-uid="' + u.id + '" title="Profil">👤</button>' +
        '</div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('[data-act]').forEach(function(btn){
      btn.onclick = function(){
        const act = btn.dataset.act;
        const uid2 = btn.dataset.uid;
        const u2 = user(uid2);
        if (!u2) return;
        if (act === 'chat') { m.remove(); go('chatroom', { chatWith: uid2 }); }
        else if (act === 'profile') { m.remove(); go('userprofile', { profileId: uid2 }); }
        else if (act === 'wa') {
          const wa = u2.wa ? u2.wa.replace(/[^0-9]/g, '').replace(/^0/, '62') : '';
          if (!wa) return toast('User belum isi nomor WA');
          const url = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Halo ' + u2.name + ', saya dari Temu Kawan 👋');
          window.open(url, '_blank');
        }
      };
    });
  }

  setTimeout(function(){
    drawList();
    $('closeOnline').onclick = function(){ m.remove(); };
    $('onlineSearch').addEventListener('input', function(e){ searchQuery = e.target.value.trim(); drawList(); });
    $('onlineFilter').onclick = function(e){
      const b = e.target.closest('.tab'); if (!b) return;
      $('onlineFilter').querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active'); filterMode = b.dataset.filter; drawList();
    };
    // Auto refresh tiap 5 detik
    if (onlineModalTimer) clearInterval(onlineModalTimer);
    onlineModalTimer = setInterval(function(){
      if (!document.getElementById('onlineModal')) { clearInterval(onlineModalTimer); onlineModalTimer = null; return; }
      state = loadState();
      drawList();
    }, 5000);
  }, 10);

  m.onclick = function(e){ if (e.target === m) { m.remove(); if (onlineModalTimer) clearInterval(onlineModalTimer); } };
}

function openUploadChoice(){
  const m = document.createElement('div');
  m.className = 'modal-bg open';
  m.innerHTML = '<div class="modal"><h3>📤 Upload</h3>' +
    '<button class="btn" id="upPost" style="margin-bottom:10px">📷 Buat Postingan</button>' +
    '<button class="btn" id="upReel" style="background:linear-gradient(135deg,#a855f7,#ec4899);margin-bottom:10px">🎬 Upload Reel</button>' +
    '<button class="btn sec" id="upCancel">Batal</button></div>';
  document.body.appendChild(m);
  $('upPost').onclick = function(){ m.remove(); openCompose(); };
  $('upReel').onclick = function(){ m.remove(); openUploadReel(); };
  $('upCancel').onclick = function(){ m.remove(); };
  m.onclick = function(e){ if (e.target === m) m.remove(); };
}

function go(screen, opts){
  opts = opts || {};
  for (const k in opts) view[k] = opts[k];
  view.screen = screen;
  if (screen !== 'chatroom') view.chatWith = null;
  if (screen !== 'groupchat') view.groupId = null;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function goBack(){
  const backMap = {
    pengaturan:'profile', pusatakun:'pengaturan', keamanan:'pengaturan', tentang:'pengaturan',
    verifikasi:'pengaturan', verifdetail:'verifikasi', kelolauser:'pengaturan', statistik:'pengaturan',
    userprofile:'feed', notif:'feed', groups:'chat', chatroom:'chat', groupchat:'groups',
    sounds:'pengaturan', reels:'feed'
  };
  go(backMap[view.screen] || 'feed');
}

function totalUnreadChats(){
  const id = getMeId(); let n = 0;
  for (const k in state.chats){
    if (k.indexOf(id) < 0) continue;
    const msgs = state.chats[k] || [];
    const last = msgs[msgs.length-1];
    if (last && last.from !== id && (!last.readBy || !last.readBy[id])) n++;
  }
  return n;
}

/* ============ FEED ============ */
function renderFeed(root){
  const sw = document.createElement('div');
  sw.className = 'stories';
  const ids = [getMeId()].concat(me().following || []);
  ids.slice(0, 12).forEach(function(uid2){
    const u = user(uid2); if (!u) return;
    const hasS = (state.stories[uid2]||[]).filter(function(s){return Date.now()-s.time < 86400000;}).length > 0;
    const isMe = uid2 === getMeId();
    const div = document.createElement('div');
    div.className = 'story-item';
    div.innerHTML = '<div class="story-ring ' + (hasS?'':'seen') + '">' + avatarHtml(u) + (isMe && !hasS ? '<div class="plus">+</div>' : '') + '</div><div class="lbl">' + (isMe ? 'Kamu' : esc(u.name.split(' ')[0])) + '</div>';
    div.onclick = function(){
      if (isMe && !hasS) openStoryCreator();
      else if (hasS) openStoryViewer(uid2);
      else toast('Belum ada status');
    };
    sw.appendChild(div);
  });
  root.appendChild(sw);

  const trig = document.createElement('div');
  trig.className = 'ct';
  trig.innerHTML = avatarHtml(me(), 'sm') + '<div class="fake">Apa yang kamu pikirkan, ' + esc(me().name.split(' ')[0]) + '?</div><span style="font-size:20px">📷</span>';
  trig.onclick = openCompose;
  root.appendChild(trig);

  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  const t1 = document.createElement('button');
  t1.className = 'tab ' + (view.feedTab==='all'?'active':'');
  t1.textContent = '🌏 Semua';
  t1.onclick = function(){ view.feedTab='all'; render(); };
  const t2 = document.createElement('button');
  t2.className = 'tab ' + (view.feedTab==='following'?'active':'');
  t2.textContent = '👥 Mengikuti';
  t2.onclick = function(){ view.feedTab='following'; render(); };
  tabs.appendChild(t1); tabs.appendChild(t2);
  root.appendChild(tabs);

  let posts = state.posts.slice().sort(function(a,b){return b.time-a.time;});
  if (view.feedTab === 'following') {
    const f = me().following || [];
    posts = posts.filter(function(p){return f.indexOf(p.authorId) >= 0 || p.authorId === getMeId();});
  }
  if (!posts.length){
    root.innerHTML += '<div class="empty"><div class="big">📭</div><h4>Belum ada postingan</h4><p>Ikuti orang lain atau buat postingan pertamamu!</p></div>';
    return;
  }
  posts.forEach(function(p){ root.appendChild(buildPost(p)); });
}

function buildPost(p){
  const a = user(p.authorId); if (!a) return document.createElement('div');

    '<div class="time">' + timeAgo(p.time) + '</div></div>' +
    (isMine || me().isAdmin ? '<button class="icon-btn" style="width:32px;height:32px;font-size:14px" id="delPost_'+p.id+'">🗑️</button>' : '') +
    '</div>' +
    (p.text ? '<div class="post-text">' + esc(p.text) + '</div>' : '') +

      '<button class="act" id="cmt_' + p.id + '"><span>💬</span>' + (p.comments.length||'') + '</button>' +
      '<button class="act" id="shr_' + p.id + '"><span>🔗</span></button>' +
    '</div>' +
    '<div class="comments" id="c_' + p.id + '">' +
      p.comments.map(function(c){
        const u = user(c.userId) || {name:'?',avatar:'❓'};
        return '<div class="cmt">' + avatarHtml(u,'xs') + '<div class="body"><b>' + esc(u.name) + '</b>' + esc(c.text) + '</div></div>';
      }).join('') +
      '<div class="cmt-input">' + avatarHtml(me(),'xs') +
      '<input id="ci_' + p.id + '" placeholder="Tulis komentar..." maxlength="150">' +
      '<button id="cisend_' + p.id + '">➤</button></div>' +
    '</div>';
  setTimeout(function(){
    const likeBtn = $('like_' + p.id);
    const cmtBtn = $('cmt_' + p.id);
    const shrBtn = $('shr_' + p.id);
    const delBtn = $('delPost_' + p.id);
    const imgBtn = $('img_' + p.id);
    const nameBtn = $('name_' + p.id);
    const cmtInput = $('ci_' + p.id);
    const cmtSend = $('cisend_' + p.id);
    if (likeBtn) likeBtn.onclick = function(){ toggleLike(p.id); };
    if (cmtBtn) cmtBtn.onclick = function(){ const c = $('c_' + p.id); if (c) c.classList.toggle('open'); };
    if (shrBtn) shrBtn.onclick = function(){ sharePost(p.id); };
    if (delBtn) delBtn.onclick = function(){ deletePost(p.id); };
    if (imgBtn) imgBtn.onclick = function(){ viewImage(p.id); };
    if (nameBtn) nameBtn.onclick = function(){ go('userprofile', { profileId: a.id }); };
    if (cmtInput) cmtInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') addComment(p.id); });
    if (cmtSend) cmtSend.onclick = function(){ addComment(p.id); };
  }, 10);
  return el;
}

window.viewImage = function(postId){
  const p = state.posts.find(function(x){return x.id === postId;});

        (isMine ? '<button class="reel-act" data-reel-act="del" data-id="' + r.id + '"><span>🗑️</span></button>' : '') +
      '</div>' +
      '<div class="reel-overlay">' +
        '<div class="reel-user">' + avatarHtml(a, 'sm') + '<span class="name">' + nameWithBadge(a) + '</span></div>' +
        (r.caption ? '<div class="reel-caption">' + esc(r.caption) + '</div>' : '') +
        '<div style="font-size:11px;opacity:.7">' + timeAgo(r.time) + '</div>' +
      '</div>';

    reel.querySelectorAll('[data-reel-act]').forEach(function(btn){
      btn.onclick = function(e){
        e.stopPropagation();
        const act = btn.dataset.reelAct;
        const rid = btn.dataset.id;
        if (act === 'like') toggleReelLike(rid);
        else if (act === 'cmt') shareReel(rid);
        else if (act === 'del') deleteReel(rid);

    });

  app.appendChild(container);

    const videos = container.querySelectorAll('video');

      entries.forEach(function(entry){
        if (entry.isIntersecting) entry.target.play().catch(function(){});
        else entry.target.pause();
      });
    }, { threshold: 0.6 });

  }, 100);

function playCustomSound(s, btn){

  soundAudioEl.play().then(function(){

    soundAudioEl.onended = function(){ btn.classList.remove('playing'); btn.textContent = '▶️'; };
  }).catch(function(){ toast('⚠️ Gagal putar sound'); });

async function openRecordSound(){
  const m = document.createElement('div');
  m.className = 'modal-bg open';
  m.innerHTML = '<div class="modal"><h3>🎤 Rekam Sound</h3>' +
    '<p style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px">Maks 15 detik</p>' +
    '<div style="text-align:center;font-size:60px;margin-bottom:14px" id="recIcon">🎤</div>' +
    '<div style="text-align:center;font-size:24px;font-weight:900;color:var(--p1);margin-bottom:14px" id="recTimeSound">0.0 dtk</div>' +
    '<label>Nama Sound</label><input class="field" id="soundName" placeholder="Contoh: Suara hujan" maxlength="40">' +
    '<button class="btn" id="recStart">🎤 Mulai Rekam</button>' +
    '<button class="btn sec" id="recCancel" style="margin-top:8px">Batal</button></div>';
  document.body.appendChild(m);
  let soundRecorder = null;
  let soundChunks = [];
  let soundTimer = null;
  let soundStart = 0;
  $('recCancel').onclick = function(){ m.remove(); };
  $('recStart').onclick = async function(){
    if (soundRecorder && soundRecorder.state === 'recording') { soundRecorder.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      soundChunks = [];
      soundRecorder = new MediaRecorder(stream);
      soundRecorder.ondataavailable = function(e){ if (e.data.size > 0) soundChunks.push(e.data); };
      soundRecorder.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        clearInterval(soundTimer);
        const blob = new Blob(soundChunks, { type: 'audio/webm' });
        if (blob.size < 500) { toast('Rekaman pendek'); return; }
        const reader = new FileReader();
        reader.onload = function(){
          const url = reader.result;
          if (url.length > 700000) { toast('Terlalu panjang'); return; }
          const name = $('soundName').value.trim() || ('Sound ' + new Date().toLocaleTimeString('id-ID'));
          if (!state.customSounds) state.customSounds = [];
          state.customSounds.unshift({ id: uid('snd'), name: name, url: url, by: getMeId(), time: Date.now() });
          saveState(); m.remove();
          toast('🎤 Sound direkam!');
          render();
        };
        reader.readAsDataURL(blob);
      };
      soundRecorder.start();
      soundStart = Date.now();
      $('recStart').textContent = '⏹ Stop & Simpan';
      $('recIcon').textContent = '🔴';
      soundTimer = setInterval(function(){
        const t = (Date.now() - soundStart)/1000;
        $('recTimeSound').textContent = t.toFixed(1) + ' dtk';
        if (t >= 15) soundRecorder.stop();
      }, 100);
    } catch(e){ toast('❌ Mikrofon tidak diizinkan'); }
  };
  m.onclick = function(e){ if (e.target === m) m.remove(); };
}

    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const sc = Math.min(1, 900 / img.width);
        const c = document.createElement('canvas');
        c.width = img.width * sc; c.height = img.height * sc;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        pendingImage = c.toDataURL('image/jpeg', 0.85);
        $('imgPrevEl').src = pendingImage;
        $('imgPrev').classList.add('show');
        $('filterPanel').style.display = 'block';
        btn.disabled = false;
        applyFilterPreview();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  $('compCam').onchange = handleFile;
  $('compGal').onchange = handleFile;
  $('fxGrid').onclick = function(e){
    const b = e.target.closest('.filter-item'); if (!b) return;
    this.querySelectorAll('.filter-item').forEach(function(x){x.classList.remove('sel');});
    b.classList.add('sel'); currentFilter.effect = b.dataset.fx;
    applyFilterPreview();
  };
  $('fxBright').oninput = function(){ currentFilter.brightness = this.value; $('vBright').textContent = this.value; applyFilterPreview(); };
  $('fxContrast').oninput = function(){ currentFilter.contrast = this.value; $('vContrast').textContent = this.value; applyFilterPreview(); };
  $('fxSaturate').oninput = function(){ currentFilter.saturate = this.value; $('vSaturate').textContent = this.value; applyFilterPreview(); };
  $('fxBlur').oninput = function(){ currentFilter.blur = this.value; $('vBlur').textContent = this.value; applyFilterPreview(); };
  $('stkRow').onclick = function(e){
    const b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
    b.classList.add('sel'); currentFilter.sticker = b.dataset.stk;
    applyFilterPreview();
  };
  btn.onclick = async function(){
    const t = text.value.trim();
    if (!t && !pendingImage) return;
    let finalImg = pendingImage;
    if (pendingImage) finalImg = await applyFilterToBase64(pendingImage);
    state.posts.unshift({ id: uid('p'), authorId: getMeId(), text: t, image: finalImg, likes: [], comments: [], time: Date.now() });
    saveState(); closeCompose(); go('feed');
    toast('Postingan dibuat! 🎉');
  };
  m.onclick = function(e){ if (e.target === m) closeCompose(); };
}

function applyFilterPreview(){
  const el = $('imgPrevEl'); if (!el) return;
  el.style.filter = buildFilter();
}

async function applyFilterToBase64(dataUrl){
  return new Promise(function(res, rej){
    const img = new Image();
    img.onload = function(){
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.filter = buildFilter();
      ctx.drawImage(img, 0, 0);
      if (currentFilter.sticker) {
        ctx.filter = 'none';
        ctx.font = (c.width * 0.15) + 'px serif';
        ctx.textAlign = 'right';
        ctx.fillText(currentFilter.sticker, c.width - 20, c.height - 20);
      }
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej; img.src = dataUrl;
  });
}

/* ============ FOLLOW FIX ============ */
function toggleFollow(userId){
  if (userId === getMeId()) return;
  const u = user(userId); if (!u) return;
  const meU = me();
  if (!meU.following) meU.following = [];
  if (!u.followers) u.followers = [];
  const i = meU.following.indexOf(userId);
  if (i >= 0) {
    meU.following.splice(i, 1);
    u.followers = u.followers.filter(function(x){return x !== getMeId();});
    toast('Batal ikuti ' + u.name);
  } else {
    meU.following.push(userId);
    if (u.followers.indexOf(getMeId()) < 0) u.followers.push(getMeId());
    pushNotif(userId, 'follow', { by: getMeId(), name: meU.name, avatar: meU.avatar, avatarPic: meU.avatarPic });
    toast('Mengikuti ' + u.name + ' ✅');
    if (u.isBot && (!u.following || u.following.indexOf(getMeId()) < 0)) {
      setTimeout(function(){
        if (!u.following) u.following = [];
        u.following.push(getMeId());
        if (!meU.followers) meU.followers = [];
        if (meU.followers.indexOf(u.id) < 0) meU.followers.push(u.id);
        pushNotif(getMeId(), 'follow', { by: u.id, name: u.name, avatar: u.avatar });
        saveState();
      }, 1500 + Math.random()*1500);
    }
  }
  saveState(); render();
}

    '<div class="pin-pad" id="pinPad">' + [1,2,3,4,5,6,7,8,9,'C',0,'✓'].map(function(v){return '<button data-v="'+v+'">'+v+'</button>';}).join('') + '</div>' +
    '<button class="btn sec" id="pinCancel">Batal</button></div>';
  document.body.appendChild(m);
  $('pinCancel').onclick = function(){ m.remove(); };
  $('pinPad').onclick = function(e){
    const b = e.target.closest('button'); if (!b) return;
    const v = b.dataset.v;
    if (v === 'C') pinInput = '';
    else if (v === '✓') {
      if (pinInput.length !== 4) return toast('PIN harus 4 digit');
      me().pin = pinInput;
      saveState(); m.remove(); toast('✅ PIN aktif!'); render();
      return;
    } else {
      if (pinInput.length < 4) pinInput += v;
    }
    $('pinDots').textContent = pinInput.padEnd(4,'○').replace(/\d/g,'●').slice(0,4);
  };
  m.onclick = function(e){ if (e.target === m) m.remove(); };
}

  if (me().isFounder) return toast('Founder sudah otomatis terverifikasi');

  const m = document.createElement('div');
  m.className = 'modal-bg open';
  m.innerHTML = '<div class="modal"><h3>✓ Ajukan Verifikasi</h3>' +
    '<div class="sk-box"><b>📜 Syarat & Ketentuan:</b>' + SK_VERIFIKASI.map(function(s,i){return (i+1) + '. ' + s;}).join('<br>') + '</div>' +

    '<label>Kota/Kabupaten</label><input class="field" id="vKota" placeholder="Contoh: Jakarta" maxlength="40">' +
    '<label>Nomor WhatsApp</label><input class="field" id="vWA" placeholder="08xxxxxxxxxx" maxlength="15">' +
    '<label>Alasan</label><textarea class="field" id="vAlasan" placeholder="Alasan (min 20 karakter)..." maxlength="300" style="min-height:80px;resize:none;font-family:inherit"></textarea>' +
    '<label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:13px;color:var(--txt);font-weight:600;margin-bottom:14px;cursor:pointer">' +
    '<input type="checkbox" id="vSetuju" style="width:auto;margin:0"> Saya menyetujui S&K di atas</label>' +
    '<button class="btn" id="vKirim">📤 Kirim Pengajuan</button>' +
    '<button class="btn sec" id="vCancel" style="margin-top:8px">Batal</button></div>';
  document.body.appendChild(m);
  $('vCancel').onclick = function(){ m.remove(); };
  $('vKirim').onclick = function(){
    const nama = $('vNama').value.trim();
    const kota = $('vKota').value.trim();
    const wa = $('vWA').value.trim();
    const alasan = $('vAlasan').value.trim();
    const setuju = $('vSetuju').checked;
    if (!nama) return toast('Isi nama lengkap');
    if (!kota) return toast('Isi kota');
    if (!wa || wa.length < 10) return toast('Isi WA yang valid');
    if (!alasan || alasan.length < 20) return toast('Alasan min 20 karakter');
    if (!setuju) return toast('Centang S&K dulu');
    const vId = uid('v');
    state.verifikasi.unshift({
      id: vId, userId: getMeId(), nama: nama, kota: kota, wa: wa, alasan: alasan,
      waktu: Date.now(), status: 'pending', chat: []

    saveState(); m.remove();
    toast('📤 Pengajuan terkirim!');
    render();

}

  }
  const pending = state.verifikasi.filter(function(v){return v.status === 'pending';});

function rejectVerifikasi(id){

  root.appendChild(row);

  $('chatInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendMessage(); });
  $('micBtn').onclick = toggleRecord;
  $('chatImg').onchange = function(e){
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const sc = Math.min(1, 900 / img.width);
        const c = document.createElement('canvas');
        c.width = img.width * sc; c.height = img.height * sc;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        sendMsg({ type:'image', image: c.toDataURL('image/jpeg', 0.75), text:'' });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  setTimeout(function(){ body.scrollTop = body.scrollHeight; }, 40);
}

function sendMessage(){
  const inp = $('chatInput'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  sendMsg({ text: text });
  inp.value = '';
}

function sendMsg(msgObj){
  const meId = getMeId();
  const u = user(view.chatWith); if (!u) return;
  const key = chatKey(meId, u.id);
  if (!state.chats[key]) state.chats[key] = [];
  const msg = { from: meId, time: Date.now(), readBy: {} };
  msg.readBy[meId] = true;
  for (const k in msgObj) msg[k] = msgObj[k];
  state.chats[key].push(msg);
  saveState();
  renderChatRoom($('pageBody'));
  pushNotif(u.id, 'message', { by: meId });
  saveState();
  if (u.isBot) {
    setTimeout(function(){
      const reply = BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)];
      const rmsg = { from: u.id, text: reply, time: Date.now(), readBy: {} };
      rmsg.readBy[u.id] = true;
      state.chats[key].push(rmsg);
      u.lastSeen = Date.now();
      saveState();
      if (view.screen === 'chatroom' && view.chatWith === u.id) {
        renderChatRoom($('pageBody'));
        playSoundEffect(700, 0.2);
      }
    }, 1200 + Math.random()*1200);
  }
}

async function toggleRecord(){
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = function(e){ if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(recordingTimer);
      const ov = $('recOverlay'); if (ov) ov.remove();
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      if (blob.size < 500) { toast('Rekaman pendek'); return; }
      const reader = new FileReader();
      reader.onload = function(){
        const audio = reader.result;
        if (audio.length > 900000) { toast('Terlalu panjang'); return; }
        sendMsg({ type:'audio', audio: audio, text:'' });
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    recordingStart = Date.now();
    const ov = document.createElement('div');
    ov.id = 'recOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:20px';
    ov.innerHTML = '<div style="font-size:80px">🎤</div><div id="recTimer" style="font-size:32px;font-weight:800">0:00</div><button id="stopRecBtn" style="background:#ef4444;color:#fff;padding:16px 40px;border-radius:40px;font-weight:800;border:none;cursor:pointer">⏹ Stop</button>';
    document.body.appendChild(ov);
    $('stopRecBtn').onclick = toggleRecord;
    recordingTimer = setInterval(function(){
      const s = Math.floor((Date.now() - recordingStart) / 1000);
      const t = $('recTimer'); if (t) t.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
      if (s >= 60) toggleRecord();
    }, 200);
  } catch (e) { toast('❌ Mikrofon tidak diizinkan'); }
}

  const idsSet = {};
  (me().following||[]).forEach(function(i){ idsSet[i] = true; });
  (me().followers||[]).forEach(function(i){ idsSet[i] = true; });
  const friendIds = Object.keys(idsSet).map(function(id){ return user(id); }).filter(function(u){ return u && u.id !== getMeId(); });
  const m = document.createElement('div');
  m.className = 'modal-bg open';
  let html = '<div class="modal"><h3>➕ Buat Grup</h3>' +
    '<input class="field" id="gName" placeholder="Nama grup" maxlength="30">' +
    '<label>Emoji</label>' +
    '<div class="emoji-pick" id="gEmoji">' + ['👥','🌟','🔥','🎮','📚','🎵','⚽','🍕','💼','🎨','🐱','🌸'].map(function(e,i){return '<button data-e="'+e+'" class="'+(i===0?'sel':'')+'">'+e+'</button>';}).join('') + '</div>' +
    '<label>Pilih anggota</label>' +
    '<div id="gMembers" style="max-height:200px;overflow-y:auto;margin-bottom:14px">';
  if (!friendIds.length) {
    html += '<p style="color:var(--muted);font-size:13px;padding:10px">Belum ada teman.</p>';
  } else {
    friendIds.forEach(function(u){
      html += '<div class="user-row" data-id="' + u.id + '" style="margin-bottom:6px">' + avatarHtml(u,'sm') +
        '<div class="info"><div class="name">' + esc(u.name) + '</div></div>' +
        '<div class="chk" style="width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0">✓</div></div>';
    });
  }
  html += '</div><button class="btn" id="gCreate">Buat</button>' +
    '<button class="btn sec" id="gCancel" style="margin-top:8px">Batal</button></div>';
  m.innerHTML = html;
  document.body.appendChild(m);
  $('gCancel').onclick = function(){ m.remove(); };
  $('gEmoji').onclick = function(e){
    const b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');});
    b.classList.add('sel'); emoji = b.dataset.e;
  };
  $('gMembers').onclick = function(e){
    const row = e.target.closest('.user-row'); if (!row) return;
    const chk = row.querySelector('.chk');
    const id = row.dataset.id;
    const i = selectedMembers.indexOf(id);
    if (i >= 0) { selectedMembers.splice(i,1); chk.style.background = ''; chk.style.color = ''; }
    else { selectedMembers.push(id); chk.style.background = 'var(--p1)'; chk.style.color = '#fff'; }
  };
  $('gCreate').onclick = function(){
    const name = $('gName').value.trim();
    if (!name) return toast('Isi nama grup');
    if (!selectedMembers.length) return toast('Pilih anggota');
    const gid = uid('g_');
    state.groups[gid] = {
      id: gid, name: name, emoji: emoji,
      members: [getMeId()].concat(selectedMembers),
      admins: [getMeId()], createdBy: getMeId(), createdAt: Date.now(),
      messages: [{ id: uid('gm'), from: getMeId(), text: 'Grup "' + name + '" dibuat', time: Date.now(), system: true }]
    };
    saveState(); m.remove();
    toast('Grup dibuat! 🎉');
    go('groupchat', { groupId: gid });
  };
  m.onclick = function(e){ if (e.target === m) m.remove(); };
}

function renderGroupChat(root){
  const meId = getMeId();
  const g = state.groups[view.groupId]; if (!g) { go('groups'); return; }
  const body = document.createElement('div');
  body.className = 'chat-body'; body.id = 'chatBody';
  g.messages.forEach(function(m){
    const div = document.createElement('div');
    if (m.system) {
      div.style.cssText = 'text-align:center;font-size:12px;color:var(--muted);padding:6px';
      const u = user(m.from) || { name:'?' };
      div.textContent = u.name + ' ' + m.text;
    } else {
      const isMe = m.from === meId;
      const u = user(m.from) || { name:'?', avatar:'❓' };
      div.className = 'bubble ' + (isMe ? 'me' : 'them');
      let content = '';
      if (!isMe) content += '<div style="font-size:11px;font-weight:700;color:var(--p1);margin-bottom:4px">' + esc(u.name) + '</div>';
      if (m.type === 'image') content += '<img src="' + m.image + '">';
      else if (m.type === 'audio') content += '<audio controls src="' + m.audio + '"></audio>';
      content += esc(m.text||'');
      content += '<span class="t">' + timeFull(m.time) + '</span>';
      div.innerHTML = content;
    }
    body.appendChild(div);
  });
  root.appendChild(body);

  const row = document.createElement('div');
  row.className = 'chat-input-row';
  row.innerHTML = '<button class="sm-btn" id="grpImgBtn">📷</button>' +
    '<input type="file" id="grpImg" accept="image/*" style="display:none">' +
    '<input id="chatInput" placeholder="Ketik pesan grup..." maxlength="300">' +
    '<button class="send" id="sendGrpBtn">➤</button>';
  root.appendChild(row);
  $('grpImgBtn').onclick = function(){ $('grpImg').click(); };
  $('sendGrpBtn').onclick = sendGroupMessage;
  $('chatInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') sendGroupMessage(); });
  $('grpImg').onchange = function(e){
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      const img = new Image();
      img.onload = function(){
        const sc = Math.min(1, 900 / img.width);
        const c = document.createElement('canvas');
        c.width = img.width * sc; c.height = img.height * sc;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        g.messages.push({ id: uid('gm'), from: meId, type:'image', image: c.toDataURL('image/jpeg', 0.75), time: Date.now() });
        saveState(); renderGroupChat($('pageBody'));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  };
  setTimeout(function(){ body.scrollTop = body.scrollHeight; }, 40);
}

function sendGroupMessage(){
  const inp = $('chatInput'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const g = state.groups[view.groupId]; if (!g) return;
  g.messages.push({ id: uid('gm'), from: getMeId(), text: text, time: Date.now() });
  inp.value = '';
  saveState();
  renderGroupChat($('pageBody'));
  const bots = g.members.filter(function(mid){ return state.users[mid] && state.users[mid].isBot; });
  if (bots.length) {
    const botId = bots[Math.floor(Math.random()*bots.length)];
    setTimeout(function(){
      const reply = BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)];
      g.messages.push({ id: uid('gm'), from: botId, text: reply, time: Date.now() });
      saveState();
      if (view.screen === 'groupchat' && view.groupId === g.id) {
        renderGroupChat($('pageBody'));
        playSoundEffect(700, 0.2);
      }
    }, 1200 + Math.random()*1500);
  }
}

/* ============ INIT ============ */
state = loadState();
seed();
applyTheme();
render();

document.addEventListener('visibilitychange', function(){
  if (!document.hidden) { state = loadState(); render(); }
});

setInterval(function(){
  if (getMeId() && ['feed','chat','profile','notif','reels'].indexOf(view.screen) >= 0) {
    state = loadState();
    if (view.screen === 'reels') return;
    render();
  }
}, 30000);
</script>
