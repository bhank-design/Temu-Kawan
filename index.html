function defaultState() {
  return { v:3, users:{}, posts:[], chats:{}, groups:{}, notifications:{}, stories:{}, verifikasi:[], seeded:false, theme:'light' };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.v === 3) return d; }
  } catch(e){}
  return defaultState();
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
}
function getMeId() { return localStorage.getItem(AUTOLOGIN_KEY); }
function setMeId(id) {
  if (id) localStorage.setItem(AUTOLOGIN_KEY, id);
  else localStorage.removeItem(AUTOLOGIN_KEY);
}
function me() { const id = getMeId(); return id ? state.users[id] : null; }
function user(id) { return state.users[id]; }

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function timeAgo(t) {
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 5) return 'baru saja';
  if (s < 60) return s + ' dtk';
  if (s < 3600) return Math.floor(s/60) + ' mnt';
  if (s < 86400) return Math.floor(s/3600) + ' jam';
  if (s < 604800) return Math.floor(s/86400) + ' hr';
  return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'});
}
function timeFull(t){ return new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function isOnline(id){
  const u = state.users[id]; if (!u) return false;
  if (u.isBot) return true;
  return Date.now() - (u.lastSeen || 0) < 45000;
}
function chatKey(a,b){ return [a,b].sort().join('__'); }
function toast(msg){
  const el = $('toast'); if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}
function playSound(){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 700; o.type='sine';
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    o.start(); o.stop(ctx.currentTime + 0.15);
  } catch(e){}
}
function resizeImg(file, maxW = 720, q = 0.72){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = img.width * sc; c.height = img.height * sc;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej; img.src = e.target.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function avatarHtml(u, extraClass = '') {
  if (!u) return '<div class="avatar ' + extraClass + '">❓</div>';
  if (u.avatarPic) return '<div class="avatar ' + extraClass + '"><img src="' + u.avatarPic + '"></div>';
  return '<div class="avatar ' + extraClass + '">' + (u.avatar||'👤') + '</div>';
}
function nameWithBadge(u) {
  if (!u) return '?';
  let badge = '';
  if (u.isFounder) badge = '<span class="verify-icon founder" title="Founder">✓</span>';
  else if (u.verified) badge = '<span class="verify-icon" title="Terverifikasi">✓</span>';
  return esc(u.name) + badge;
}
function applyTheme(){
  document.body.classList.toggle('dark', state.theme === 'dark');
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  saveState(); applyTheme();
  toast(state.theme === 'dark' ? '🌙 Mode Gelap' : '☀️ Mode Terang');
}
function pushNotif(userId, type, data){
  if (!state.notifications[userId]) state.notifications[userId] = [];
  state.notifications[userId].unshift({ id: uid('n'), type: type, data: data, time: Date.now(), read: false });
  if (state.notifications[userId].length > 60) state.notifications[userId] = state.notifications[userId].slice(0, 60);
}
function unreadNotifs(id){ return (state.notifications[id] || []).filter(function(n){return !n.read;}).length; }

function seed(){
  if (state.seeded) return;
  state.seeded = true;
  state.users[FOUNDER.id] = {
    id: FOUNDER.id, username: FOUNDER.username, name: FOUNDER.name,
    email: 'founder@temukawan.app', avatar: FOUNDER.avatar, avatarPic: null,
    bio: FOUNDER.bio, password: FOUNDER.password,
    isBot: false, isAdmin: true, isFounder: true, verified: true,
    following: [], followers: [], joinedAt: Date.now(), lastSeen: Date.now(), pin: null
  };
  BOT_DATA.forEach(function(b, i){
    const id = 'bot' + i;
    state.users[id] = {
      id: id, name: b.name, email: b.email, avatar: b.avatar, avatarPic: null, bio: b.bio,
      isBot: true, verified: i < 3, following: [], followers: [],
      joinedAt: Date.now() - (i+1)*86400000, lastSeen: Date.now()
    };
  });
  BOT_DATA.forEach(function(_, i){
    for (let j = 0; j < BOT_DATA.length; j++) {
      if (j !== i && Math.random() < 0.55) {
        state.users['bot'+i].following.push('bot'+j);
        state.users['bot'+j].followers.push('bot'+i);
      }
    }
  });
  BOT_DATA.forEach(function(b, i){
    state.posts.push({ id: uid('p'), authorId: 'bot'+i, text: b.post, image: null, likes: [], comments: [], time: Date.now() - (i+1)*1800000 });
  });
  saveState();
}

window.toggleEye = function(inputId, btn){
  const p = $(inputId); if (!p) return;
  if (p.type === 'password') { p.type = 'text'; btn.textContent = '🙈'; }
  else { p.type = 'password'; btn.textContent = '👁️'; }
};

function enterApp(name){
  toast('Selamat datang, ' + name + '! 🎉');
  view = { screen:'feed', profileId:null, chatWith:null, groupId:null, feedTab:'all' };
  render();
  setInterval(function(){
    const id = getMeId(); if (!id || !state.users[id]) return;
    state.users[id].lastSeen = Date.now(); saveState();
  }, 15000);
}

  } else {
    hdr = document.createElement('div');
    hdr.className = 'header';
    hdr.innerHTML = '<div style="flex:1"><div class="logo">Temu Kawan' + (currentMe.isFounder ? ' 👑' : '') + '</div>' +
      '<div class="logo-sub">Menyapa Bebual Bersama</div></div>' +
      '<button class="icon-btn" id="themeBtn">' + (isDark ? '☀️' : '🌙') + '</button>' +

      avatarHtml(currentMe, '');

    setTimeout(function(){
      const tb = $('themeBtn'); if (tb) tb.onclick = toggleTheme;

    }, 10);
  }

  body.id = 'pageBody';
  app.appendChild(body);

  if (view.screen === 'feed') renderFeed(body);
  else if (view.screen === 'search') renderSearch(body);
  else if (view.screen === 'chat') renderChatList(body);
  else if (view.screen === 'chatroom') renderChatRoom(body);
  else if (view.screen === 'groups') renderGroupsList(body);
  else if (view.screen === 'groupchat') renderGroupChat(body);
  else if (view.screen === 'profile') renderProfile(body, myId, true);
  else if (view.screen === 'userprofile') renderProfile(body, view.profileId, false);
  else if (view.screen === 'notif') renderNotif(body);
  else if (view.screen === 'pengaturan') renderPengaturan(body);
  else if (view.screen === 'verifikasi') renderVerifikasi(body);
  else if (view.screen === 'kelolauser') renderKelolaUser(body);
  else if (view.screen === 'statistik') renderStatistik(body);
  else if (view.screen === 'pusatakun') renderPusatAkun(body);
  else if (view.screen === 'keamanan') renderKeamanan(body);
  else if (view.screen === 'tentang') renderTentang(body);

  if (['profile','pengaturan','pusatakun','keamanan','tentang'].indexOf(view.screen) < 0) {
    const footer = document.createElement('div');
    footer.className = 'footer-copy';
    footer.innerHTML = '© 2025 <b>Shank Anggara From Ulumonggo</b><br>All Rights Reserved';

    '<button class="navbtn ' + (view.screen==='feed'?'active':'') + '" id="navHome"><span class="ic">🏠</span>Beranda</button>' +
    '<button class="navbtn ' + (view.screen==='search'?'active':'') + '" id="navSearch"><span class="ic">🔍</span>Cari</button>' +
    '<button class="navbtn create" id="navCreate"><span class="ic">+</span></button>' +
    '<button class="navbtn ' + (['chat','chatroom','groups','groupchat'].indexOf(view.screen)>=0?'active':'') + '" id="navChat"><span class="ic">💬</span>Chat' + (unC ? '<span class="badge" style="top:6px;right:14px">' + (unC>9?'9+':unC) + '</span>' : '') + '</button>' +
    '<button class="navbtn ' + (['profile','pengaturan','pusatakun','keamanan','tentang'].indexOf(view.screen)>=0?'active':'') + '" id="navProfile"><span class="ic">👤</span>Profil</button>' +
    '</div>';

  document.body.appendChild(nav);
  setTimeout(function(){
    const h = $('navHome'); if (h) h.onclick = function(){ go('feed'); };
    const s = $('navSearch'); if (s) s.onclick = function(){ go('search'); };
    const c = $('navCreate'); if (c) c.onclick = openCompose;
    const ch = $('navChat'); if (ch) ch.onclick = function(){ go('chat'); };
    const p = $('navProfile'); if (p) p.onclick = function(){ go('profile'); };
  }, 10);
}

function go(screen, opts){
  opts = opts || {};
  for (const k in opts) view[k] = opts[k];
  view.screen = screen;
  if (screen !== 'chatroom') view.chatWith = null;
  if (screen !== 'groupchat') view.groupId = null;
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function goBack(){
  const backMap = {
    'pengaturan': 'profile',
    'pusatakun': 'pengaturan',
    'keamanan': 'pengaturan',
    'tentang': 'pengaturan',
    'verifikasi': 'pengaturan',
    'kelolauser': 'pengaturan',
    'statistik': 'pengaturan',
    'userprofile': 'feed',
    'notif': 'feed',
    'groups': 'chat',
    'chatroom': 'chat',
    'groupchat': 'groups'
  };
  const dest = backMap[view.screen] || 'feed';
  go(dest);
}

function totalUnreadChats(){
  const id = getMeId(); let n = 0;
  for (const k in state.chats){
    if (k.indexOf(id) < 0) continue;
    const msgs = state.chats[k] || [];
    const last = msgs[msgs.length-1];
    if (last && last.from !== id && (!last.readBy || !last.readBy[id])) n++;
  }
  return n;
}

function buildPost(p){

  const liked = p.likes.indexOf(getMeId()) >= 0;

    '<div class="time">' + timeAgo(p.time) + '</div></div>' +
    (isMine || me().isAdmin ? '<button class="icon-btn" style="width:32px;height:32px;font-size:14px" id="delPost_'+p.id+'">🗑️</button>' : '') +
    '</div>' +
    (p.text ? '<div class="post-text">' + esc(p.text) + '</div>' : '') +
    (p.image ? '<img class="post-img" src="' + p.image + '" id="img_' + p.id + '">' : '') +
    '<div class="post-actions">' +
      '<button class="act ' + (liked?'liked':'') + '" id="like_' + p.id + '"><span>' + (liked?'❤️':'🤍') + '</span>' + (p.likes.length||'') + '</button>' +
      '<button class="act" id="cmt_' + p.id + '"><span>💬</span>' + (p.comments.length||'') + '</button>' +
      '<button class="act" id="shr_' + p.id + '"><span>🔗</span></button>' +
    '</div>' +
    '<div class="comments" id="c_' + p.id + '">' +
      p.comments.map(function(c){
        const u = user(c.userId) || {name:'?',avatar:'❓'};
        return '<div class="cmt">' + avatarHtml(u,'xs') + '<div class="body"><b>' + esc(u.name) + '</b>' + esc(c.text) + '</div></div>';
      }).join('') +
      '<div class="cmt-input">' + avatarHtml(me(),'xs') +
      '<input id="ci_' + p.id + '" placeholder="Tulis komentar..." maxlength="150">' +
      '<button id="cisend_' + p.id + '">➤</button></div>' +
    '</div>';

  setTimeout(function(){
    const likeBtn = $('like_' + p.id);
    const cmtBtn = $('cmt_' + p.id);
    const shrBtn = $('shr_' + p.id);
    const delBtn = $('delPost_' + p.id);
    const imgBtn = $('img_' + p.id);
    const cmtInput = $('ci_' + p.id);
    const cmtSend = $('cisend_' + p.id);
    if (likeBtn) likeBtn.onclick = function(){ toggleLike(p.id); };
    if (cmtBtn) cmtBtn.onclick = function(){ const c = $('c_' + p.id); if (c) c.classList.toggle('open'); };
    if (shrBtn) shrBtn.onclick = function(){ sharePost(p.id); };
    if (delBtn) delBtn.onclick = function(){ deletePost(p.id); };
    if (imgBtn) imgBtn.onclick = function(){ viewImage(p.id); };
    if (cmtInput) cmtInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') addComment(p.id); });
    if (cmtSend) cmtSend.onclick = function(){ addComment(p.id); };
  }, 10);

window.viewImage = function(postId){
  const p = state.posts.find(function(x){return x.id === postId;});
  if (!p || !p.image) return;
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  m.innerHTML = '<img src="' + p.image + '" style="max-width:100%;max-height:100%;border-radius:16px;object-fit:contain">' +
    '<button style="position:absolute;top:20px;right:20px;width:44px;height:44px;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;font-size:24px;border:none;cursor:pointer">✕</button>';
  m.onclick = function(e){
    if (e.target === m || e.target.tagName === 'BUTTON') m.remove();
  };
  document.body.appendChild(m);
};

function toggleLike(id){
  const p = state.posts.find(function(x){return x.id === id;}); if (!p) return;
  const meId = getMeId();
  const i = p.likes.indexOf(meId);
  if (i >= 0) p.likes.splice(i, 1);
  else { p.likes.push(meId); if (p.authorId !== meId) pushNotif(p.authorId, 'like', { by: meId }); }
  saveState(); render();
}
function addComment(id){
  const inp = $('ci_' + id); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const p = state.posts.find(function(x){return x.id === id;}); if (!p) return;
  p.comments.push({ userId: getMeId(), text: text, time: Date.now() });
  if (p.authorId !== getMeId()) pushNotif(p.authorId, 'comment', { by: getMeId(), text: text });
  inp.value = ''; saveState(); render();
  setTimeout(function(){ const c = $('c_' + id); if (c) c.classList.add('open'); }, 30);
}
function deletePost(id){
  if (!confirm('Hapus postingan ini?')) return;
  state.posts = state.posts.filter(function(x){return x.id !== id;});
  saveState(); render(); toast('Postingan dihapus');
}
function sharePost(id){
  const p = state.posts.find(function(x){return x.id === id;}); if (!p) return;
  const txt = (p.text || '[Foto]') + ' — dari Temu Kawan';
  if (navigator.share) navigator.share({ title:'Temu Kawan', text: txt }).catch(function(){});
  else { if (navigator.clipboard) navigator.clipboard.writeText(txt); toast('Teks dicopy 📋'); }
}

/* ============ COMPOSE ============ */
function openCompose(){
  pendingImage = null;
  const m = document.createElement('div');
  m.className = 'modal-bg open'; m.id = 'composeModal';
  m.innerHTML = '<div class="modal"><h3>✍️ Buat Postingan</h3>' +
    '<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">' + avatarHtml(me(),'sm') + '<div style="font-weight:700">' + esc(me().name) + '</div></div>' +
    '<textarea class="field" id="compText" placeholder="Apa yang kamu pikirkan?" maxlength="500" style="min-height:100px;resize:none;font-family:inherit"></textarea>' +
    '<div class="img-prev" id="imgPrev"><img id="imgPrevEl"><button id="rmImgBtn">✕</button></div>' +
    '<button class="mini-btn" style="width:100%;padding:11px;margin-bottom:14px" id="addImgBtn">📷 Tambah Foto</button>' +
    '<input type="file" id="compFile" accept="image/*" style="display:none">' +
    '<button class="btn" id="compPost" disabled>Posting</button>' +
    '<button class="btn sec" id="compCancel" style="margin-top:8px">Batal</button></div>';
  document.body.appendChild(m);
  const text = $('compText'), btn = $('compPost');
  text.addEventListener('input', function(){ btn.disabled = !text.value.trim() && !pendingImage; });
  text.focus();
  $('addImgBtn').onclick = function(){ $('compFile').click(); };
  $('compCancel').onclick = closeCompose;
  $('rmImgBtn').onclick = function(){ pendingImage = null; $('imgPrev').classList.remove('show'); btn.disabled = !text.value.trim(); };
  $('compFile').onchange = async function(e){
    const f = e.target.files[0]; if (!f) return;
    try { pendingImage = await resizeImg(f); $('imgPrevEl').src = pendingImage; $('imgPrev').classList.add('show'); btn.disabled = false; }
    catch(err){ toast('Gagal memuat gambar'); }
  };
  btn.onclick = function(){
    const t = text.value.trim();
    if (!t && !pendingImage) return;
    state.posts.unshift({ id: uid('p'), authorId: getMeId(), text: t, image: pendingImage, likes: [], comments: [], time: Date.now() });
    saveState(); closeCompose(); go('feed');
    toast('Postingan dibuat! 🎉');
  };
  m.onclick = function(e){ if (e.target === m) closeCompose(); };
}
function closeCompose(){ const m = $('composeModal'); if (m) m.remove(); pendingImage = null; }

function openStoryViewer(userId){
  const list = (state.stories[userId]||[]).filter(function(s){return Date.now()-s.time < 86400000;}).sort(function(a,b){return a.time-b.time;});
  if (!list.length) return;
  let idx = 0;
  const u = user(userId);
  const v = document.createElement('div');
  v.style.cssText = 'position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff';
  document.body.appendChild(v);
  function draw(){
    const s = list[idx];
    if (!s.seenBy) s.seenBy = [];
    if (s.seenBy.indexOf(getMeId()) < 0) s.seenBy.push(getMeId());
    saveState();
    v.innerHTML = '<div style="position:absolute;top:20px;left:20px;right:20px;display:flex;gap:10px;align-items:center">' + avatarHtml(u,'sm') + '<div><div style="font-weight:800">' + esc(u.name) + '</div><div style="font-size:11px;opacity:.7">' + timeAgo(s.time) + '</div></div></div>' +
      '<button id="stClose" style="position:absolute;top:20px;right:20px;color:#fff;font-size:26px;background:none;border:none">✕</button>' +
      '<div style="font-size:120px" id="stNext">' + s.emoji + '</div>' +
      (s.text ? '<div style="position:absolute;bottom:80px;left:20px;right:20px;text-align:center;font-size:18px;font-weight:600;padding:16px;background:rgba(0,0,0,.4);border-radius:16px">' + esc(s.text) + '</div>' : '');
    setTimeout(function(){
      const c = $('stClose'); if (c) c.onclick = closeStory;
      const n = $('stNext'); if (n) n.onclick = nextStory;
    }, 10);
    clearTimeout(window._storyTimer);
    window._storyTimer = setTimeout(nextStory, 5000);
  }
  function nextStory(){ if (idx < list.length-1) { idx++; draw(); } else closeStory(); }
  function closeStory(){ clearTimeout(window._storyTimer); v.remove(); render(); }
  window.nextStory = nextStory;
  window.closeStory = closeStory;
  draw();
}

function renderSearch(root){
  const wrap = document.createElement('div');

  result.id = 'srchResult';
  root.appendChild(result);
  function draw(q){
    q = q || '';
    result.innerHTML = '';
    const meId = getMeId();
    const ql = q.toLowerCase();
    const users = Object.values(state.users).filter(function(u){
      if (u.id === meId) return false;
      if (!q) return true;
      return u.name.toLowerCase().indexOf(ql) >= 0 ||
             (u.email && u.email.toLowerCase().indexOf(ql) >= 0) ||
             (u.bio && u.bio.toLowerCase().indexOf(ql) >= 0);
    });
    const uh = document.createElement('div');
    uh.className = 'section-title';
    uh.innerHTML = '👥 Orang <span class="num">' + users.length + '</span>';
    result.appendChild(uh);
    if (!users.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.style.padding = '20px';
      empty.innerHTML = '<p>Tidak ditemukan</p>';
      result.appendChild(empty);
      return;
    }
    users.slice(0, 30).forEach(function(u){
      const isF = me().following.indexOf(u.id) >= 0;
      const row = document.createElement('div');
      row.className = 'user-row';
      row.innerHTML = avatarHtml(u, isOnline(u.id)?'online':'') +
        '<div class="info"><div class="name">' + nameWithBadge(u) + (u.isBot?'<span style="background:rgba(16,185,129,.15);color:var(--ok);font-size:9px;padding:1px 6px;border-radius:6px;font-weight:800">BOT</span>':'') + '</div>' +

        if (fb) fb.onclick = function(e){ e.stopPropagation(); toggleFollow(u.id); };
      }, 10);
    });
  }
  draw('');
  $('srchInput').addEventListener('input', function(e){ draw(e.target.value.trim()); });

/* ============ FOLLOW ============ */
function toggleFollow(userId){
  if (userId === getMeId()) return;
  const u = user(userId); if (!u) return;
  const meU = me();
  const i = meU.following.indexOf(userId);
  if (i >= 0) {
    meU.following.splice(i, 1);
    u.followers = u.followers.filter(function(x){return x !== getMeId();});
    toast('Batal ikuti ' + u.name);
  } else {
    meU.following.push(userId);
    if (u.followers.indexOf(getMeId()) < 0) u.followers.push(getMeId());
    pushNotif(userId, 'follow', { by: getMeId() });
    toast('Mengikuti ' + u.name + ' ✅');
    if (u.isBot && u.following.indexOf(getMeId()) < 0) {
      setTimeout(function(){
        u.following.push(getMeId());
        if (meU.followers.indexOf(u.id) < 0) meU.followers.push(u.id);
        pushNotif(getMeId(), 'follow', { by: u.id });
        saveState();
      }, 1500 + Math.random()*1500);
    }
  }
  saveState(); render();
}

  };

function showUserList(userId, type){

}

function renderVerifikasi(root){
  if (!me().isFounder && !me().isAdmin) {
    root.innerHTML = '<div class="empty"><div class="big">⛔</div><p>Akses khusus Founder</p></div>';
    return;
  }
  const pending = state.verifikasi.filter(function(v){return v.status === 'pending';});
  const riwayat = state.verifikasi.filter(function(v){return v.status !== 'pending';}).slice(0, 10);
  const h = document.createElement('div');
  h.className = 'section-title';
  h.innerHTML = '📥 Pengajuan <span class="num">' + pending.length + '</span>';
  root.appendChild(h);
  if (!pending.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.style.padding = '30px';
    empty.innerHTML = '<div class="big">📭</div><h4>Tidak ada pengajuan</h4>';
    root.appendChild(empty);
  } else {
    pending.forEach(function(v){
      const u = user(v.userId); if (!u) return;
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = '<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">' + avatarHtml(u,'sm') +
        '<div style="flex:1"><div style="font-weight:800;font-size:14px">' + esc(u.name) + '</div>' +
        '<div style="font-size:11px;color:var(--muted)">' + esc(u.email||'') + ' • ' + timeAgo(v.waktu) + '</div></div></div>' +
        '<div style="background:rgba(255,107,53,.06);border-radius:10px;padding:10px;font-size:12px;line-height:1.6;margin-bottom:10px">' +
        '<b style="color:var(--p1)">📝 Nama:</b> ' + esc(v.nama) + '<br>' +
        '<b style="color:var(--p1)">💬 Alasan:</b> ' + esc(v.alasan) + '</div>' +
        '<div style="display:flex;gap:8px">' +
        '<button class="btn" style="flex:1;background:linear-gradient(135deg,#10b981,#059669);box-shadow:none;padding:10px" id="appr_' + v.id + '">✓ Setujui</button>' +
        '<button class="btn" style="flex:1;background:rgba(239,68,68,.15);color:var(--err);box-shadow:none;padding:10px" id="rej_' + v.id + '">✕ Tolak</button></div>';
      root.appendChild(div);
      setTimeout(function(){
        const a = $('appr_' + v.id); if (a) a.onclick = function(){ approveVerifikasi(v.id); };
        const r = $('rej_' + v.id); if (r) r.onclick = function(){ rejectVerifikasi(v.id); };
      }, 10);
    });
  }
  if (riwayat.length) {
    const rh = document.createElement('div');
    rh.className = 'section-title';
    rh.style.marginTop = '20px';
    rh.innerHTML = '📜 Riwayat';

      root.appendChild(div);
    });
  }
}

function approveVerifikasi(id){
  const v = state.verifikasi.find(function(x){return x.id === id;}); if (!v) return;
  v.status = 'approved'; v.diprosesAt = Date.now();
  const u = state.users[v.userId];
  if (u) { u.verified = true; pushNotif(u.id, 'verified', { by: FOUNDER.id }); }
  saveState(); toast('✅ User diverifikasi!'); render();
}
function rejectVerifikasi(id){
  if (!confirm('Tolak pengajuan ini?')) return;
  const v = state.verifikasi.find(function(x){return x.id === id;}); if (!v) return;
  v.status = 'rejected'; v.diprosesAt = Date.now();

function sendMessage(){
  const inp = $('chatInput'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  sendMsg({ text: text });
  inp.value = '';
}

function sendMsg(msgObj){
  const meId = getMeId();
  const u = user(view.chatWith); if (!u) return;
  const key = chatKey(meId, u.id);
  if (!state.chats[key]) state.chats[key] = [];
  const msg = { from: meId, time: Date.now(), readBy: {} };
  msg.readBy[meId] = true;
  for (const k in msgObj) msg[k] = msgObj[k];
  state.chats[key].push(msg);
  saveState();
  renderChatRoom($('pageBody'));
  pushNotif(u.id, 'message', { by: meId });
  saveState();
  if (u.isBot) {
    setTimeout(function(){
      const reply = BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)];
      const rmsg = { from: u.id, text: reply, time: Date.now(), readBy: {} };
      rmsg.readBy[u.id] = true;
      state.chats[key].push(rmsg);
      u.lastSeen = Date.now();
      saveState();
      if (view.screen === 'chatroom' && view.chatWith === u.id) {
        renderChatRoom($('pageBody'));
        playSound();
      }
    }, 1200 + Math.random()*1200);
  }
}

async function toggleRecord(){
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = function(e){ if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(recordingTimer);
      const ov = $('recOverlay'); if (ov) ov.remove();
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      if (blob.size < 500) { toast('Rekaman terlalu pendek'); return; }
      const reader = new FileReader();
      reader.onload = function(){
        const audio = reader.result;
        if (audio.length > 900000) { toast('Rekaman terlalu panjang'); return; }
        sendMsg({ type:'audio', audio: audio, text:'' });
      };
      reader.readAsDataURL(blob);
      const btn = $('micBtn'); if (btn) btn.classList.remove('rec');
    };
    mediaRecorder.start();
    recordingStart = Date.now();
    const btn = $('micBtn'); if (btn) btn.classList.add('rec');
    const ov = document.createElement('div');
    ov.id = 'recOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:20px';
    ov.innerHTML = '<div style="font-size:80px">🎤</div><div id="recTimer" style="font-size:32px;font-weight:800">0:00</div><div style="font-size:13px;opacity:.7">Merekam... (maks 60 dtk)</div><button id="stopRecBtn" style="background:#ef4444;color:#fff;padding:16px 40px;border-radius:40px;font-weight:800;font-size:16px;border:none;cursor:pointer">⏹ Stop</button>';
    document.body.appendChild(ov);
    $('stopRecBtn').onclick = toggleRecord;
    recordingTimer = setInterval(function(){
      const s = Math.floor((Date.now() - recordingStart) / 1000);
      const t = $('recTimer'); if (t) t.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
      if (s >= 60) toggleRecord();
    }, 200);
  } catch (e) { toast('❌ Tidak bisa akses mikrofon'); }
}

      g.messages.push({ id: uid('gm'), from: meId, type:'image', image: img, time: Date.now() });
      saveState(); renderGroupChat($('pageBody'));
    } catch(err){ toast('Gagal kirim gambar'); }
  };
  setTimeout(function(){ body.scrollTop = body.scrollHeight; }, 40);
}

function sendGroupMessage(){
  const inp = $('chatInput'); if (!inp) return;
  const text = inp.value.trim(); if (!text) return;
  const g = state.groups[view.groupId]; if (!g) return;
  g.messages.push({ id: uid('gm'), from: getMeId(), text: text, time: Date.now() });
  inp.value = '';
  saveState();
  renderGroupChat($('pageBody'));
  const bots = g.members.filter(function(mid){ return state.users[mid] && state.users[mid].isBot; });
  if (bots.length) {
    const botId = bots[Math.floor(Math.random()*bots.length)];
    setTimeout(function(){
      const reply = BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)];
      g.messages.push({ id: uid('gm'), from: botId, text: reply, time: Date.now() });
      saveState();
      if (view.screen === 'groupchat' && view.groupId === g.id) {
        renderGroupChat($('pageBody'));
        playSound();
      }
    }, 1200 + Math.random()*1500);
  }
}

/* ============ INIT ============ */
state = loadState();
seed();
applyTheme();
render();

document.addEventListener('visibilitychange', function(){
  if (!document.hidden) { state = loadState(); render(); }
});
</script>
